# Insert into vnscriptstudio.cn server block (before SPA fallback).
# Also add near top of http/server:
#   limit_req_zone $binary_remote_addr zone=fan_lottery_ocr:10m rate=30r/m;

    # ---- 粉丝抽奖 OCR API（内存识别，不落盘）----
    location = /fan-lottery-ocr/health {
        proxy_pass http://fan-lottery-ocr:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /fan-lottery-ocr/ {
        limit_req zone=fan_lottery_ocr burst=10 nodelay;
        client_max_body_size 8m;
        proxy_pass http://fan-lottery-ocr:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_request_buffering on;
    }
